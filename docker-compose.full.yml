version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  aggregator:
    build:
      context: ./backend/aggregator
      dockerfile: Dockerfile
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKER: kafka:9092
    env_file:
      - ./backend/aggregator/.env   # Your GITHUB_TOKEN lives here
    restart: on-failure

  frontend:
    build:
      context: ./frontend/dashboard
      dockerfile: Dockerfile
    depends_on:
      - aggregator
    ports:
      - "5173:80"

  simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile.simulator
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:9092
    restart: on-failure
